# Publishes the week's blog post. Posts are dated a Thursday apart, and a post
# dated after the build is not built (src/lib/blog.ts), so the site has to be
# rebuilt on Thursdays for the next one to appear. This asks Vercel to rebuild
# production from main through a deploy hook.
#
# Setup (once, by the owner): Vercel > Project > Settings > Git > Deploy Hooks,
# create a hook for the main branch, then add its URL as the repository secret
# VERCEL_DEPLOY_HOOK. Until the secret exists this job fails and nothing ships.
#
# GitHub turns off scheduled workflows after 60 days with no repository
# activity; re-enable it from the Actions tab if that happens.
name: Weekly blog post

on:
  schedule:
    - cron: '0 13 * * 4' # Thursday 13:00 UTC, morning in the US
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel to rebuild production
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK is not set" >&2; exit 1; fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
