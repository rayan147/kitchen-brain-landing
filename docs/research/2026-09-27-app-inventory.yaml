terms:
- term: Client vs customer
  app_meaning: Screens and sidebar say 'Clients' (a person or company in the client book, with contacts and venues). Code and some offer screens say customer. CONTEXT.md lists 'customer' on screen under
    Avoid.
  not_to_confuse_with: The typed customer on an order; a storefront requester (never becomes a Client automatically); CostCook's own Stripe customer.
  landing_use: Landing says 'customer' throughout (MenusQuotesFeature.astro, ordering.ts, CustomerOutcomes). Use 'client'.
- term: Invoice (unqualified)
  app_meaning: The SUPPLIER invoice (/purchases/invoices). No customer invoice exists (#504 unbuilt).
  not_to_confuse_with: Customer invoice or receivable. Also collides with 'Invoice' as a client payment-method label (PaymentTrackingCard.svelte:16).
  landing_use: Landing uses it correctly for supplier invoices; never write it for client billing.
- term: Proposal / offer / quote / estimate
  app_meaning: Proposal = the document the caterer builds; offer = one sent revision with a client link; 'estimate' is what a storefront client sees and 'quote' is the owner's word for the same storefront
    number.
  not_to_confuse_with: Sage drafts; the landing's "quote" (a draft order with a per-guest price).
  landing_use: Landing's /features/menus-and-quotes calls the draft order a 'quote'. The proposal now carries staff, rentals, delivery, service fee, tax, options and choice groups.
- term: Acceptance (#501)
  app_meaning: The client's 'Accept this selection' on one offer revision. The page says 'Acceptance is not an e-signature or a booking confirmation.'
  not_to_confuse_with: Approval (#512); signature; booking.
- term: Approval (#512)
  app_meaning: The kitchen's yes to a storefront request; opens a 72-hour Payment Window; the order is still a draft. Flagged (ordering_integration).
  not_to_confuse_with: Acceptance; 'confirmed'; booked. Approved is not confirmed.
- term: Agreement vs contract
  app_meaning: UI step 5 says Agreement (/agreement); older screens, code and Settings > Contracts (templates) say contract.
  not_to_confuse_with: Proposal acceptance.
- term: Contract signing
  app_meaning: 'DocuSeal, only when DOCUSEAL_* is configured; the signing page says ''Test environment. Use controlled test recipients only.'' Live status in production unknown. Paper path: ''Record a signed
    PDF received outside CostCook'' (does not verify signatures).'
  not_to_confuse_with: A built-in e-signature the landing may claim today.
- term: Kitchen draft
  app_meaning: The tentative order prepared from an accepted proposal; 'holds no day and draws no crew until you book the event.' One food service only.
  not_to_confuse_with: A hand-typed draft order; a proposal draft.
- term: Booked
  app_meaning: The event's kitchen-draft order was confirmed with 'Confirm order'; the event then reads 'The order is confirmed. This event is booked.' Checks day capacity, not signature or deposit.
  not_to_confuse_with: 'Paid; signed; accepted; approved. Caveat: the workspace chip says ''Booked'' once an agreement completes (app inconsistency).'
- term: Deposit / balance
  app_meaning: 'Obligations on the ORDER (''Catering deposit'', ''Catering balance''). Events: owner types a deposit and records money by hand (check, cash, transfer, or own processor); ''Nothing is sent
    to the client from here''; no balance, due date or reminder. Storefront (flagged): deposit plus dated balance with one reminder email and pay link.'
  not_to_confuse_with: Subscription billing; a customer invoice.
- term: Payment processor for client money
  app_meaning: 'Stripe Connect (caterer is merchant of record on its own connected account), storefront orders only, behind ordering_integration. Event deposits: no processor in CostCook, recorded by hand.
    Square never touches client money. A siteless card checkout for events exists only uncommitted in kb-client-payment.'
  not_to_confuse_with: CostCook's own subscription (Stripe platform account); Square (catalog and sales only, sandbox).
- term: Confirmed / frozen
  app_meaning: Confirming freezes quantities, prices and totals ('Confirmation freezes the current quantities and prices.'). Prep reads 'As confirmed {date}'.
  not_to_confuse_with: Frozen food.
- term: Packed (last tracked state)
  app_meaning: Nothing is tracked after 'Packed · Finished {when} by {name}'. Today draws a 'Load out' step that never lights (vans=null). 'Vans' is a per-day capacity count in Booking settings.
  not_to_confuse_with: Delivery, dispatch, driver routes, proof of delivery (PRD 09-10, unbuilt).
  landing_use: Landing imagery 'Seven in the van', 'Close the van' (OrderShopPrepPackFeature.astro:87,153) must not become a delivery claim.
- term: Closeout
  app_meaning: 'After-event food-cost review, food only, opens the day after the event: planned vs ''Actual food cost, at what you paid'', as a share of the frozen agreed price.'
  not_to_confuse_with: Closing the books, P&L, labor costing.
- term: Revenue / event value
  app_meaning: Booked price (per-guest price x guests + adjustment), frozen at confirm; from an accepted proposal, exactly the one accepted food-service charge net of discount. Never cash received.
  not_to_confuse_with: Cash collected, deposits, the proposal grand total.
- term: Gross margin
  app_meaning: The app shows 'Gross margin' on the event menu totals (src/lib/components/events/menu/EventTotals.svelte:38) and the recipe pricing summary (RecipePricingSummary.svelte:91). It is food-only
    (price minus food cost).
  not_to_confuse_with: Business margin or profit (labor and overhead are not modelled).
  landing_use: 'Landing FAQ says the number ''is never called margin'' (faq.ts:209): now untrue about the app''s wording.'
- term: Draft vs working copy
  app_meaning: 'UI says ''draft'' for both a never-published recipe and an unpublished edit of a live one (''Save draft'', ''Draft changes: not live yet''). CONTEXT.md says a working copy must not be called
    draft.'
  not_to_confuse_with: Order drafts; kitchen drafts; Sage drafts.
  landing_use: Follow the UI word (draft) unless the owner rules otherwise.
- term: Sage draft (not proposal)
  app_meaning: 'Sage''s approval cards say ''Draft shopping list'', ''Draft guest change'', ''Discard this draft''. Three draft kinds: kitchen shopping list, one order''s shopping list, a draft order''s
    guest count. 22 read tools.'
  not_to_confuse_with: The client Proposal (#501).
  landing_use: Landing says 'shopping-list proposal' and 'eleven read-only checks' (faq.ts:186, sage.ts:46,67,72, SageFeature.astro:23,28,220).
- term: Sage (two things)
  app_meaning: (1) the agent (panel, /sage) behind SAGE_ENABLED; (2) 'Draft with Sage' passes on ingredients, recipes and setup, which run on the import model and do NOT depend on SAGE_ENABLED. 'Build the
    dish with Sage' in setup is a link to the recipe importer.
  not_to_confuse_with: Automatic allergen detection; a model that learns the kitchen.
- term: Nutrition label
  app_meaning: '''Calculated estimate''; ''This estimate is not a claim of retail-label regulatory compliance.'' Sources are USDA matches or Sage drafts a person confirms.'
  not_to_confuse_with: Lab analysis; an FDA-compliant retail label.
- term: Allergens
  app_meaning: 'The fixed US nine (drizzle/0034_dizzy_klaw.sql: milk, egg, fish, crustacean shellfish, tree nuts, peanuts, wheat, soy, sesame). No custom allergens.'
  not_to_confuse_with: Dietary characteristics (five diets).
  landing_use: Landing says 'fourteen allergens' in six places.
- term: Plan
  app_meaning: 'One plan, ''CostCook Launch'', $49 USD per kitchen per month, 15-day trial with a card ($0 today), unlimited teammates (checkout sends seats: 1). No feature is gated by tier.'
  not_to_confuse_with: Release flags and role gates, which are not tiers.
- term: Online ordering area
  app_meaning: 'Four names in the app: ''Ordering site'', ''Online ordering'', ''Ordering integration'', ''storefront''. All behind ordering_integration.'
  not_to_confuse_with: The client proposal page (/o/[token]).
  landing_use: 'Landing: ''Taking orders'' and ''enquiry''. Pick one caterer word.'
- term: Partner
  app_meaning: 'On screen: an outside payment or ordering system (''A trusted partner reports payment.'').'
  not_to_confuse_with: CONTEXT.md's 'partner' (the caterer).
  landing_use: Avoid on the landing.
- term: Supplier vs vendor
  app_meaning: Mostly 'supplier'; Settings says 'Vendors & suppliers', 'Add vendor'.
  not_to_confuse_with: n/a
  landing_use: Landing uses 'supplier'; keep it.
- term: Kitchen / workspace
  app_meaning: '''Kitchen'' to owners; ''workspace'' in refusals and integration cards.'
  not_to_confuse_with: A location (multi-unit is off-page).
- term: Kitchen records
  app_meaning: UI name for /catalog (ingredients, recipes, menus, inventory); 'the book' is the recipe list.
  not_to_confuse_with: n/a
- term: Readiness
  app_meaning: '''Ready to serve and sell: N of 6 done'' on the recipe page.'
  not_to_confuse_with: A completeness score (CONTEXT.md says avoid).
- term: Price sheet
  app_meaning: A supplier's asking prices; updates catalog pack cost, never a purchase or month spend.
  not_to_confuse_with: An invoice or purchase.
- term: Should have cost / Did cost
  app_meaning: Purchases header labels; Analytics Month review says 'Planned food usage cost' / 'Recorded ingredient purchases' for the same figures.
  not_to_confuse_with: Waste (the gap is never called waste unless logged).
