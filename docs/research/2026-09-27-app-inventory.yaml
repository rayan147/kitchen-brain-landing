    access: read-only
    min_role: STAFF
    confirmation_required: false
    evidence: src/lib/server/sage/tools.ts:111-119
  - name: findOrders
    does: Orders by name, event date or date range, with id, date, guests, status (drafts included). Turns 'the Rodriguez order' / 'Saturday' into ids.
    access: read-only
    min_role: STAFF
    confirmation_required: false
    evidence: src/lib/server/sage/tools-orders.ts:68-75
  - name: getOrderList
    does: One order's shop list (by supplier, net of shelf), prep list, or pack list (with equipment).
    access: read-only
    min_role: STAFF
    confirmation_required: false
    evidence: src/lib/server/sage/tools-orders.ts:132-140
  - name: explainOrderMoney
    does: One order's revenue, food cost incl. misc line, food cost per guest, food cost % vs target, price that would meet target; for confirmed orders frozen figures plus planned vs actual spend.
    access: read-only
    min_role: MANAGER
    confirmation_required: false
    evidence: src/lib/server/sage/tools-money.ts:51-59
  - name: explainMenuMargin
    does: One menu's cost per guest vs price per guest, food cost % vs target, target price, costliest dish.
    access: read-only
    min_role: MANAGER
    confirmation_required: false
    evidence: src/lib/server/sage/tools-money.ts:151-159
  - name: summarizeSpending
    does: Month food cost (usage and invoice spend vs event revenue, waste, unaccounted gap) or spend by supplier/category over 30/90/365 days vs previous period.
    access: read-only
    min_role: MANAGER
    confirmation_required: false
    evidence: src/lib/server/sage/tools-money.ts:247-255
  - name: explainIngredient
