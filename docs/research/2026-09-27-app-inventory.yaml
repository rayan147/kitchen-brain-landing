plan_matrix:
  plans:
  - name: CostCook Launch
    price: $49 USD per kitchen workspace per month (amountCents 4900, currency usd, interval month)
    trial: 15 days, card collected, $0 charged today
    seats: 'unlimited teammates (docs/billing.md:11); Stripe checkout sends seats: 1 (src/routes/settings/billing/+page.server.ts:53)'
    source: src/lib/server/billing/plan.ts:1-8; docs/billing.md:7-12
    display_override: LAUNCH_PRICE_DISPLAY env can change the price text shown; the Stripe price id is the real charge (src/lib/server/billing/launch-terms.ts:9-14)
  headline: One plan. No feature in the code is gated by plan tier. Access is controlled by four other layers below.
  gates:
    subscription:
      rule: All or nothing per kitchen. active, trialing, cancel-at-period-end and past_due keep access; missing/canceled/unpaid/paused block only when BILLING_ENFORCEMENT=enforce (off is the default, warn
        shows a banner)
      source: src/lib/server/billing/access.ts:34-63; src/hooks.server.ts:523-537
      production_value: unverified (open question)
    release_flags:
      note: Per-business override row in business_feature_overrides, else env default; all default off; no admin UI to flip them (src/lib/server/features/access.ts:43-97)
      label_printing: gates only /settings/labels (hooks.server.ts:507-513). Label printing from prep/pack does not read the flag.
      ordering_integration: gates /settings/ordering (partner keys + outgoing webhooks), /settings/ordering/site (storefront setup, Stripe Connect for client payments), and /api/ordering/* keys (src/lib/server/ordering/route.ts:73-79)
      square_integration: gates Square connect/publish/sales jobs (src/lib/server/integrations/execution-access.ts:6-15); also hard Sandbox-only
      quickbooks_integration: gates QuickBooks connect/export; also hard Sandbox-only
    env_flags:
      SETUP_SAMPLE_DATA_ENABLED: only the sample load inside /setup (src/routes/setup/+page.server.ts:94). /settings/sample-data is not gated by it.
      LABEL_PRINT_SIMULATOR_ENABLED: /settings/labels/simulator test tool
      BILLING_TEST_MODE: local-only /settings/billing/test-checkout rehearsal; requires localhost + AUTH_RATE_LIMIT_DISABLED=1 (src/lib/server/billing/local-test-mode.ts)
    roles: 'see roles: above'
  features_advertised_in_app: 'The plan card lists 12 inclusions (src/lib/components/settings/BillingPlanCard.svelte:240-289): Recipe and menu costing; Menus and event proposals; Orders and prep lists;
    Purchasing and receiving; Vendor price tracking; Inventory workflows; Food cost analytics; Customer management; Team access; Label printing; Square and QuickBooks sync; Online ordering. ''Square and
    QuickBooks sync'' (:283) is Sandbox-only, and ''Label printing'' (:279) / ''Online ordering'' (:287) depend on flags that default off.'
  feature_map:
  - feature: Sign-up, trial, setup, settings, team
    gate: subscription
  - feature: Recipe/menu costing, orders, shop/prep/pack, purchasing, analytics, customers, events/proposals
    gate: subscription (+ roles)
  - feature: Label settings screen
    gate: subscription + label_printing flag
  - feature: Ordering site setup, partner API keys, outgoing webhooks
    gate: subscription + ordering_integration flag; Stripe connect owner only
  - feature: Square publish and sales
    gate: subscription + square_integration flag + Sandbox only (not live)
  - feature: QuickBooks bills
    gate: subscription + quickbooks_integration flag + Sandbox only (not live)
  roles:
    source: src/lib/server/tenancy/roles.ts (three roles, no permission grid by owner decision)
    owner: 'Everything. Only role for BILLING_ROLES: subscription, Square connect/publish, QuickBooks connect and sending bills/credits, Stripe connect for the ordering site, supplier timing and minimums
      (src/routes/settings/vendors/[id]/timing/+page.server.ts:11), publishing and restoring recipe revisions and archiving recipes (src/routes/catalog/recipes/[id]/publish/+page.server.ts:28, history/+page.server.ts:48,
      archive/+page.server.ts:24), bulk-approving invoices.'
    manager: Setup and all settings except Billing (KITCHEN_SETUP_ROLES); invite/revoke/remove Staff (TEAM_ROLES; cannot remove an owner or manager); sample data; client directory (CUSTOMER_DIRECTORY_ROLES);
      proposals, events, contracts (SALES_ROLES); record a payment on an order; correct prep; close event food-cost review; price-impact decisions; refresh Square sales.
    staff: Works from orders and lists; catalog and lists open. Cannot open any settings screen except Notifications, cannot run setup, cannot see the client directory, cannot mark an order paid, cannot
      add suppliers (e2e/role-access.spec.ts:39-270).
    gaps:
    - Invites always create Staff (src/routes/settings/team/+page.server.ts:33) and there is no in-app role change; how a manager is made today is unknown (owner question).
  summary: One plan, CostCook Launch, $49 per kitchen per month, 15-day trial with card, $0 today. No feature is gated by plan tier. Access runs through subscription, release flags, env flags and roles.
sage_tools:
  summary: '25 tools: 22 read-only, 3 that write a draft which a person approves (0 commit tools). The landing says eleven read checks and one proposal (RC-49, faq.ts:186, sage.ts:46).'
  agent_model:
    agent:
      config: src/lib/server/sage/config.ts:88-92
      default: anthropic:claude-sonnet-5 (SAGE_AI_PROVIDER default 'anthropic'; SAGE_AI_MODEL default 'claude-sonnet-5')
      alternative: google:gemini-3.5-flash when SAGE_AI_PROVIDER=google
      test_double: SAGE_AI_PROVIDER=fake, only honoured when BETTER_AUTH_URL starts with http://localhost (config.ts:100-104)
      sdk: Vercel AI SDK streamText + stepCountIs (src/lib/server/sage/agent.ts:20, 270)
    drafting_passes:
      config: src/lib/server/import/provider.ts:63-103
      default: google:gemini-3.5-flash-lite (IMPORT_AI_PROVIDER default 'google'); anthropic:claude-sonnet-5 if IMPORT_AI_PROVIDER=anthropic
      stub: IMPORT_AI_PROVIDER=stub, localhost only (provider.ts:51-52)
      gate: 'ingredientFactClassifierIsConfigured(): not killed AND (stub OR API key present). NOT gated on SAGE_ENABLED (provider.ts:63-74)'
  limits:
    maxSteps: 8
    maxRunMs: 60000
    maxQuestionChars: 2000
    maxOutputTokens: 2000
    maxConcurrentRunsPerTenant: 3
    maxRunsPerUserPerHour: 60
    maxTokensPerTenantPerDay: 1500000
    maxRowsPerTool: 25
    kill_switch: SAGE_KILL_SWITCH=stop closes the agent AND every Sage-branded drafting pass (config.ts:35-37; provider.ts:63-74)
    refusal_messages: src/lib/server/sage/request.ts:96-113 (e.g. 'Sage needs an active subscription.', 'That is a lot of questions in one hour. Try again shortly.', 'Sage has used its allowance for this
      kitchen today. It frees up over the next day; the kitchen screens all still work.')
  tools:
  - name: getOrderAttentionSummary
    does: What needs attention across upcoming orders, purchasing, receiving and costing, optionally for one event date; includes each order's dietary-guard conflicts. Same getHomeDashboard the Today screen
