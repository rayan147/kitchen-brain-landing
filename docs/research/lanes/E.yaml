terms:
  - term: "Working copy vs draft"
    app_meaning: "CONTEXT.md: Working Copy = unpublished edit of a live recipe; 'draft' = a never-published builder. UI uses 'draft' for both ('Save draft', 'Draft changes: not live yet', 'Restore version N as draft', 'Discard draft changes')."
    not_to_confuse_with: "order drafts and approved-but-unconfirmed orders"
  - term: "Version / Revision"
    app_meaning: "Frozen published snapshot, numbered from 1 ('Version 3 · Live'). Restoring copies an old one into draft changes and publishes a NEW number."
    not_to_confuse_with: "rollback"
  - term: "Readiness"
    app_meaning: "Server findings on Cost, Method, Allergens, Nutrition, Portion, Prep time. UI shows 'Ready to serve and sell: N of 6 done', although CONTEXT.md says avoid completeness scores."
    not_to_confuse_with: "a percent-complete checklist"
  - term: "Kitchen records"
    app_meaning: "The UI name for /catalog (ingredients, recipes, menus, inventory). 'Catalog' is the route word; 'the book' is the recipe list's word."
    not_to_confuse_with: "records of work done"
  - term: "Archive / Delete / Remove / Take down"
    app_meaning: "Archive = out of the pickers, still resolves ('Put it back in the book'). Delete = gone, refused when used. Remove = detach (line, dish, equipment). 'Take down' = delete a collection/tag/station shelf."
    not_to_confuse_with: "each other"
  - term: "Allergen"
    app_meaning: "One of the fixed US nine, with relationship contains / may contain / cross-contact / free from / not sure, confirmed per ingredient."
    not_to_confuse_with: "dietary characteristic (vegan etc.) or an allergen-free claim"
  - term: "Dietary characteristic / diet"
    app_meaning: "Vegetarian, Vegan, Halal, Kosher, Gluten-free, derived from ingredient traits; outcome clear / check / conflict."
    not_to_confuse_with: "certification (halal/kosher are always 'check' for meat)"
  - term: "Dietary guard / guests' restrictions"
    app_meaning: "Per-order restrictions checked against dishes; frozen at confirm, 'Re-check' on demand."
    not_to_confuse_with: "customer profile preferences"
  - term: "Nutrition label"
    app_meaning: "Calculated estimate from USDA FoodData Central or Sage-drafted, person-confirmed ingredient profiles; not a regulatory label."
    not_to_confuse_with: "lab analysis, FDA-compliant retail label"
  - term: "Menu"
    app_meaning: "Internal catalog menu: dishes x portions per guest, equipment template, selling price per guest; starting price for new orders."
    not_to_confuse_with: "Menu Publication (storefront, lane C), event menu (lane A), proposal menu lines"
  - term: "Station"
    app_meaning: "Where a recipe is made (one per recipe). Filters the book and prints on the recipe sheet; prep list does not group by it."
    not_to_confuse_with: "section of a method, inventory area"
  - term: "Sage (in catalog)"
    app_meaning: "Drafts allergen/trait answers and missing nutrition from the ingredient name; nothing saved until confirmed."
    not_to_confuse_with: "automatic allergen detection"
