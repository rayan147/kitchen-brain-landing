# Lane B: Clients (route family /customers). Discovery 2026-09-27, read-only.
# Production = /home/rayan147/kitchen-brain-develop-demo at ed6ff5f01 (HEAD == origin/main, checked).
# Paths in evidence are relative to that checkout unless prefixed.
# The screen and sidebar say "Clients"; code/tables/route say `customer` (CONTEXT.md:221-223).
# Plan gate: the app has one plan (LAUNCH_PLAN, src/lib/server/billing/plan.ts:1) and the only
# release flags are label_printing, ordering_integration, square_integration, quickbooks_integration
# (src/lib/server/features/access.ts). Clients is not plan- or flag-gated; it is ROLE-gated to
# OWNER and MANAGER (src/lib/server/tenancy/roles.ts:81; sidebar hides it otherwise,
# src/lib/components/shell/AppSidebar.svelte:67,88).
# E2E status: kitchen-brain qa/full-workflow-walk-suites run of 2026-09-26
