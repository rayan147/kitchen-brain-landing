terms:
  - term: "Client (on screen) vs customer"
    meaning_in_app: "A person or company the kitchen cooks for, saved once in the client directory with contacts and venues. Screens and sidebar say 'Clients'; code/route say customer (CONTEXT.md:221-223). CONTEXT.md lists 'customer on screen' under Avoid."
    must_not_be_confused_with: "The typed customer on an order or the person who submits a Public Order Request (CONTEXT.md:216 still says 'A customer's proposed catering event'). A storefront request never creates or links a Client. Also not CostCook's Stripe 'customer' (subscription)."
    landing_drift: "The landing says 'customer' throughout (e.g. src/pages/features/menus-and-quotes.astro:8,13; src/lib/ordering.ts:63-75) and never mentions a client directory, contacts, venues, duplicates or history."
  - term: Contact
    meaning_in_app: "A named person at a Client (name, optional email/phone, 'Role or responsibility'). Picking one on an order or inquiry copies that person's details."
    must_not_be_confused_with: "A team member (staff) or the Client itself."
  - term: Venue
    meaning_in_app: "A saved address plus access instructions belonging to a Client; where the team goes for delivery or service."
    must_not_be_confused_with: "An operating unit, kitchen location or pickup location (CONTEXT.md:223 Avoid)."
  - term: "Client Selection"
    meaning_in_app: "An owner or manager explicitly choosing a saved Client (and optionally a contact and venue) for an Order or Event; copies facts once; later edits never reach the record by themselves (CONTEXT.md:225-227)."
    must_not_be_confused_with: "Auto-linking by name or phone; a sync that keeps orders updated."
  - term: Archived (client)
    meaning_in_app: "Hidden from the default list and pickers, record and history kept, restorable. Clients are never deleted."
    must_not_be_confused_with: "Deleted; merged."
  - term: Merged / Alias
    meaning_in_app: "After a reviewed merge the kept client keeps its facts; the other's name/phone/email become 'Also known as' aliases and its record becomes read-only, pointing at the kept one. No undo."
    must_not_be_confused_with: "An automatic de-duplication; archive."
  - term: "Possible duplicates"
    meaning_in_app: "Clients sharing an exact phone or exact name, listed for review only."
    must_not_be_confused_with: "Fuzzy or email-based matching (not built)."
  - term: "Section-5 core terms (Invoice, Acceptance, Approval, Booked, Deposit/balance, payment processor)"
    meaning_in_app: "Not resolved in lane B. The client profile shows none of them: no invoices, deposits, balances or booked state (ClientHistory.svelte:15-16)."
