    job_to_be_done: "Answer 'have we cooked for you before?' with the phone still in hand, without retyping a returning client"
    actors: [owner, manager]
    routes: ["/customers"]
    entry: "Sidebar 'Clients' > search 'Name or phone' + 'Search clients'; right-hand card 'Add a client' > 'Person or company' (Person / Company) > Name > 'Save client'"
    done_marker: "Flash '{name} is saved.' and the app lands on the new client's profile (src/routes/customers/+page.server.ts:150-151)"
    hands_off_to: B-02
    tier: production
    evidence:
      - "e2e/customer-directory.spec.ts:14 (an owner saves a person and a company, then finds each one again by name), :50, :70, :97 (a11y); green 2026-09-26"
      - "src/routes/customers/+page.svelte:49 PageHeader 'Clients'; :53 'The book'; :81 placeholder 'Name or phone'; :93 'Include archived'; :95 'Search clients'; :109-110 empty state 'No clients yet' / 'Save the people and companies you cook for. Next time they call, the details are already here.'; :164 'Showing {n} of {total}. Search by name or phone to find the rest.'"
      - "src/lib/components/customers/CustomerForm.svelte:82 legend 'Person or company'; :225 'Save client' / 'Saving client…'"
      - "src/lib/components/customers/CustomerForm.svelte:190-207 duplicate prompt: 'You already have {name, phone, email}. Two records for one client split its orders between them. Open it, or save a second client if this is someone else.' buttons 'Open {name}' / 'Save a second client'"
      - "src/routes/customers/+page.server.ts:119-133 duplicate check (exact phone or exact name) before save; :112-115 double-tap makes one client"
      - "src/lib/server/customers/repository.ts:109 DIRECTORY_PAGE_SIZE = 100; :252-265 search matches name, email, phone digits and merged-away aliases"
    plan_gate: "none (single Launch plan); owner or manager role only"
    limits:
      - "Only name and Person/Company are required; email, phone and note are optional."
      - "The list shows 100 clients at a time; the rest are reached by search."
      - "Search label says 'Name or phone' but it also matches email and old (merged) names."
      - "The duplicate question fires only on an exact phone or exact name match; '555 0101' vs '5550101' is not matched."
      - "No import of clients from a spreadsheet, Square, QuickBooks or anywhere else; no sample clients (grep of src/lib/server/sample-data, src/routes/import, src/lib/server/import finds no customers use). PRD 01 puts automatic imports out of scope (docs/prd/front-of-house/01-customers-inquiries.md:70)."
      - "A cook (ordinary staff) cannot open the directory: 'Only an owner or manager can open the client directory.' (src/routes/customers/+page.server.ts:32)."
      - "No delete. Archive is the removal (B-05)."
    glossary_terms: [Client, Client directory, Archived]
    capture_worthy: "yes: /customers at 390px with the 'You already have …' duplicate prompt showing 'Open {name}' and 'Save a second client'"

