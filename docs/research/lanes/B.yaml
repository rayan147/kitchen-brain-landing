    creates_client: false
    evidence: "No Square/QuickBooks code references the customers table; the only Square+customer hit in lib/server is db/schema.ts. Stripe 'customer.subscription.*' in docs/billing.md is CostCook's own subscription, not a caterer's client."
  - path: "Order form (/orders/new) typed customer"
    creates_client: false
    evidence: "The typed customer lives on the order only (CONTEXT.md:226 'an unlinked Order belongs to no Client')."
