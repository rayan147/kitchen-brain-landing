rows:
  - id: H-01
    lane: H
    workflow: "Ask Sage a question about the kitchen, beside whatever screen you are on"
    job_to_be_done: "Get a straight, cited answer (what needs attention Saturday, what's below par, what prep is due) without hunting through screens"
    actors: [owner, manager, staff]
    routes: ["/sage/api/chat", "/sage/api/panel", "(panel in AppShell on every signed-in screen)"]
    entry: "Sidebar item 'Sage' (tooltip 'Sage (⌘J)' / 'Sage (Ctrl+J)'), src/lib/components/shell/AppSidebar.svelte:205-212; composer label 'Ask about your kitchen', placeholder 'What needs my attention on Saturday?' (src/lib/components/sage/SageComposer.svelte:73,85)"
    done_marker: "Answer article 'Sage’s answer' with a 'Where this came from' source list linking to the cited records (SageMessage.svelte:135; SageSourceList.svelte:70). Empty state: 'Ask your first question' + 'Sage never changes anything on its own.' (SageConversation.svelte:332,337)"
    hands_off_to: [H-02, H-03, H-04, H-05, H-07]
    tier: production
    evidence: ["e2e/sage.spec.ts:38 (opens beside the screen, rides along, survives reload)", "e2e/sage.spec.ts:365 (first use offers real questions)", "e2e/sage.spec.ts:406 (stopped question, 'Send again')", "e2e/sage.spec.ts:445 (answer cites records and links)", "e2e/sage.spec.ts:468 (order named the way a caterer says it)", "e2e/sage.spec.ts:744 (keyboard reachable)", "e2e/import-sage.spec.ts:14 (cites staged import)", "src/lib/server/sage/tools.ts:398-411", "src/lib/server/sage/policy.ts:24-60"]
    plan_gate: "Launch (only plan). Refused with 'Sage needs an active subscription.' when subscriptionAccess.canUseProduct is false (request.ts:60-62,104-105). Also requires deployment flag SAGE_ENABLED=enabled."
    limits:
      - "Read-only: answers only from the 22 read tools; policy forbids stating any number not returned by a tool (policy.ts:27)."
      - "8 steps, 60 s, 2,000-char question, 2,000 output tokens, 60 questions/user/hour, 3 concurrent runs/kitchen, 1.5M tokens/kitchen/day."
      - "No links in prose, no tables/headings; no memory across conversations ('Never claim you learn the business, remember preferences')."
      - "Money tools (order/menu/spending/price moves/price impact), setup progress, ordering site and day-room are MANAGER+; staff get 'needs an owner or a manager'."
      - "Not covered: sales (Square), label printing, customers, events/proposals/contracts, customer invoices. Staff answers redact accepted-proposal names/totals (regression case inquiry-to-signing-usability)."
      - "Off entirely unless SAGE_ENABLED=enabled; kill switch shows 'Sage is turned off right now. Every kitchen screen still works as usual.' (SagePanel.svelte:290)."
    glossary_terms: [Sage, Attention, Par, Food Cost %, Misc cost percent, Prep list, Pack list, Shopping list]
    capture_worthy: "yes: panel docked beside Today with a cited answer and the 'Where this came from' list"

