# All paths below are relative to that checkout unless prefixed with ~/kb-sage-redesign.
# ~/kb-sage-redesign (design/sage-panel-redesign): its HEAD a76c01b8 IS an ancestor of develop (merged);
# its 40 uncommitted files are NOT on develop -> tiered off-page (H-14).
#
# IMPORTANT tier caveat: the Sage agent (H-01..H-08) is on main, but it is off unless the deployment sets
# SAGE_ENABLED=enabled exactly (src/lib/server/sage/config.ts:23). /sage 404s otherwise
# (src/routes/sage/+page.server.ts:22). Whether production sets it was NOT verified (see H-notes open questions).
# Rows are tiered "production" on code presence; the flag is recorded in plan_gate/limits.

lane: H
source_commit: ed6ff5f0130f443025ae96c0da971eca40468f93

sage_model:
  agent:
    config: "src/lib/server/sage/config.ts:88-92"
    default: "anthropic:claude-sonnet-5 (SAGE_AI_PROVIDER default 'anthropic'; SAGE_AI_MODEL default 'claude-sonnet-5')"
    alternative: "google:gemini-3.5-flash when SAGE_AI_PROVIDER=google"
    test_double: "SAGE_AI_PROVIDER=fake, only honoured when BETTER_AUTH_URL starts with http://localhost (config.ts:100-104)"
    sdk: "Vercel AI SDK streamText + stepCountIs (src/lib/server/sage/agent.ts:20, 270)"
  drafting_passes:   # the Sage-branded one-shot drafts (H-09..H-12) use the IMPORT pipeline's model, not the agent's
    config: "src/lib/server/import/provider.ts:63-103"
    default: "google:gemini-3.5-flash-lite (IMPORT_AI_PROVIDER default 'google'); anthropic:claude-sonnet-5 if IMPORT_AI_PROVIDER=anthropic"
    stub: "IMPORT_AI_PROVIDER=stub, localhost only (provider.ts:51-52)"
    gate: "ingredientFactClassifierIsConfigured(): not killed AND (stub OR API key present). NOT gated on SAGE_ENABLED (provider.ts:63-74)"

sage_limits:   # src/lib/server/sage/config.ts:69-78, enforced in agent.ts:270-285, request.ts:79-88, repository.ts:306
  maxSteps: 8
  maxRunMs: 60000
  maxQuestionChars: 2000
  maxOutputTokens: 2000
  maxConcurrentRunsPerTenant: 3
  maxRunsPerUserPerHour: 60
  maxTokensPerTenantPerDay: 1500000
  maxRowsPerTool: 25
  kill_switch: "SAGE_KILL_SWITCH=stop closes the agent AND every Sage-branded drafting pass (config.ts:35-37; provider.ts:63-74)"
  refusal_messages: "src/lib/server/sage/request.ts:96-113 (e.g. 'Sage needs an active subscription.', 'That is a lot of questions in one hour. Try again shortly.', 'Sage has used its allowance for this kitchen today. It frees up over the next day; the kitchen screens all still work.')"

