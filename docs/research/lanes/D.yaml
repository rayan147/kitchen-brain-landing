terms:
  - term: Kitchen draft
    app_meaning: "The tentative order CostCook prepares from an accepted proposal. Real enough to open and price; holds no capacity day and draws no crew until the order is confirmed (KitchenDraft.svelte:45, tentative-order.ts:100-103)"
    not_to_confuse_with: "a Draft order typed by hand (/orders?view=drafts shows both), or a proposal draft"
  - term: Booked
    app_meaning: "The event's kitchen-draft order is confirmed. There is no separate Book button; 'Confirm order' on /orders/[id] is the act, and the event then reads 'The order is confirmed. This event is booked.' (KitchenDraft.svelte:40). Confirming does not check the deposit on this path"
    not_to_confuse_with: "paid; Approval (#512) of a storefront request"
  - term: Confirmed / frozen
    app_meaning: "Confirming freezes quantities, ingredient prices and totals ('Confirmation freezes the current quantities and prices.', ConfirmOrderCard.svelte:114). 'Reopen to edit' re-costs at today's prices until purchasing starts"
    not_to_confuse_with: "frozen food; the prep screen now says 'As confirmed {date}' for this reason"
  - term: Deposit / balance
    app_meaning: "Payment obligations held on the order, one card each ('Deposit', 'Balance'; a single obligation is titled 'Payment'). Event orders: deposit only, typed by hand, offline or owner's own processor. Storefront orders: deposit + dated balance with reminder"
    not_to_confuse_with: "the CostCook subscription; a customer invoice (not built)"
  - term: Payment processor for client money
    app_meaning: "Stripe Connect hosted Checkout, the caterer as merchant of record (docs/architecture/ordering-payments.md:52-62), storefront orders only in production. Event deposits: 'A check, cash or a transfer' or 'My own card processor' (no CostCook card collection). No Square code in src/lib/server/ordering-payments/ (grep 'square' returns nothing)"
    not_to_confuse_with: "CostCook's own Stripe platform subscription; Square catalog/sales integration (lane I)"
  - term: Invoice (as a payment method)
    app_meaning: "'Invoice' is one of the method labels when recording a client payment (PaymentTrackingCard.svelte:16) alongside Check, Cash, ACH, POS, Pay later"
    not_to_confuse_with: "Invoice unqualified = supplier invoice. This label collides with the glossary"
  - term: Purchase order (PO)
    app_meaning: "The order CostCook sends a supplier for a confirmed order: email, printable sheet, or manual (post-confirmation.ts)"
    not_to_confuse_with: "the client's order; a supplier invoice"
  - term: Shelf check
    app_meaning: "Typing what is already on hand for an order's Shop list so the buy drops (OnHandEntry; 'Choose an order to shelf check', orders/list)"
    not_to_confuse_with: "an inventory count on /catalog/inventory (related, not the same screen)"
  - term: Check-off
    app_meaning: "The one verb for marking a Shop, Prep or Pack line done: 'Check off all' / 'Check off the {n} left' / 'Clear all' (GroupCheckToggle.svelte:48-51)"
    not_to_confuse_with: "tick, complete, mark (banned in the order-to-van story)"
  - term: Shortfall
    app_meaning: "Something that came up short at pack or receiving, with a cause and how the kitchen covered it ('Shortfalls on this order', ExecutionExceptions.svelte:78)"
    not_to_confuse_with: "a receiving shortage alone (that also feeds the Purchases follow-up list)"
  - term: Closeout
    app_meaning: "After-event review of planned vs actual food cost, food only, opening the day after the event ('Food-cost closeout')"
    not_to_confuse_with: "closing the books, P&L, or labor costing"
  - term: Combined production
    app_meaning: "One shopping, prep and pack view across 2 to 12 orders created together (/orders/batch)"
    not_to_confuse_with: "'This week' lists (/orders/week), which cover confirmed orders by date and have no pack list"
  - term: Load out / Vans
    app_meaning: "Today shows a 'Load out' step that is never tracked; Calendar 'Vans out' counts booked capacity per day from Booking settings, not vans actually loaded"
    not_to_confuse_with: "delivery dispatch or route planning (not built)"
