plan_gating_summary:
  subscription: "One plan (Launch, $49/workspace/month, 15-day trial; docs/billing.md). No per-feature plan tiers. Analytics has no plan gate; a lapsed subscription blocks the whole workspace only when BILLING_ENFORCEMENT=enforce."
  release_flags: "Square is a release flag, not a plan entitlement: square_integration <- FEATURE_SQUARE_INTEGRATION_ENABLED, default off, per-business override in business_feature_overrides (src/lib/server/features/access.ts:8-22; docs/billing.md 'Label printing and ordering integrations use separate release flags')."
