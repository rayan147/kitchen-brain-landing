terms:
  - term: "Analytics (in-app)"
    app_meaning: "The caterer-facing reports section: Overview, What things cost, Where the money went, Counter sales, What to charge, Month review."
    not_to_confuse_with: "docs/analytics/dashboards.md and tracking-plan.md, which are CostCook's own PostHog product telemetry (server-side events), not a caterer feature."
  - term: "Food cost % (event)"
    app_meaning: "Planned (theoretical, recipe-based, misc-inclusive) food cost / event revenue, judged against the target set at confirm."
    not_to_confuse_with: "Closeout 'Food cost, share of the event price', which uses ACTUAL draws at what was paid over the same frozen revenue; and Month review 'Recorded food-cost %', which uses invoice totals."
  - term: "Theoretical vs actual"
    app_meaning: "Theoretical = recipe/plan cost at pack prices ('Planned', 'Should have cost'). Actual has two different meanings: (a) month: 'Recorded ingredient purchases' = invoices dated in the month (what you bought, not what you used); (b) event closeout: 'Actual food cost, at what you paid' = attributed ingredient draws priced from purchases."
    not_to_confuse_with: "Waste. The gap between them is never called waste unless logged."
  - term: "Revenue / event sales / event value"
    app_meaning: "orderRevenueCents = per-guest price x guests + revenue adjustment. For an order prepared from an accepted proposal, it is exactly the ONE accepted food-service charge's net (after discount), split into a whole-cent per-guest price plus leftover cents (priceForAgreedRevenue). Staff, rental and other charges are not in it; proposals with more than one service or a split charge are refused by the bridge ('many-services', 'split-charges', tentative-order.ts:199-203)."
    not_to_confuse_with: "Cash received, deposits, balances or the proposal grand total. UI says 'Confirmed-event value is the price on those events, not cash received.'"
  - term: "Counter sales / Sale"
    app_meaning: "Completed Square register sales linked to CostCook dishes. Deliberately not orders or events."
    not_to_confuse_with: "Event sales ('Event sales booked') and online-ordering requests. CONTEXT.md 'Sale' says sales are 'Posted by a register through the ordering integration'; the report actually reads only Square's tables."
  - term: "Target (food cost)"
    app_meaning: "One business-wide target % (settings.targetFoodCostPct); frozen onto an event at confirm so a later change does not restate past events (SET-03)."
    not_to_confuse_with: "A per-dish or per-menu target (none exists)."
  - term: "Plan tier"
    app_meaning: "There is one plan (Launch). Square and ordering are release flags, not tiers."
    not_to_confuse_with: "Any landing claim of feature-gated plans."
