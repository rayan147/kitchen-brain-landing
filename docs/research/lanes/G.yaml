    lane: G
    workflow: "Check whether this week (or month, or last 90 days) is on track"
    job_to_be_done: "Know in one screen if food cost is inside target, what needs me, and why"
    actors: [owner, manager, staff]
    routes: ["/analytics"]
    entry: "Sidebar 'Analytics' (AppSidebar.svelte:76) > tab 'Overview' (src/routes/analytics/+layout.svelte:23); period switch 'This week' / 'This month' / 'Last 90 days' (PeriodSwitch.svelte:26-28)"
    done_marker: "Verdict headline '<This week> is on track.' or '<n> things need your attention.' (src/lib/domain/analytics/pulse.ts:293-298); calm text 'No price rise reaches a dish over target, and nothing is waiting on you. An empty list is an answer.' (src/routes/analytics/+page.svelte:31)"
    hands_off_to: G-02
    tier: production
    evidence:
      - e2e/analytics-decisions.spec.ts
      - src/routes/analytics/+page.server.ts:7-14
      - src/lib/server/analytics/pulse.ts:34-98
      - src/lib/domain/analytics/pulse.ts:79-104,161-277
      - src/lib/domain/analytics/callouts.ts
      - src/routes/analytics/pulse-ssr.test.ts
    numbers:
      - "'Food cost on events' = sum(planned food usage) / sum(event sales) over confirmed events that have a price AND a frozen confirmed plan with no skipped lines (counted(), pulse.ts:79). THEORETICAL (planned from recipes, misc included), not purchases. Note on tile: 'Food only, planned from your recipes. Staff, rentals and packaging are not in it.' (pulse.ts:197)"
      - "'Food margin on events' = sales minus planned food cost, same cohort (pulse.ts:202-215)"
      - "'Event sales booked' = sum of orderRevenueCents (price x guests + revenue adjustment) for confirmed priced events (pulse.ts:217-228). Booked value, not cash received."
      - "'Actual food cost against plan' = (sum closeout actual - sum planned) / planned for events closed out in the period; within 5% counts as on plan (pulse.ts:15,230-242). Source: latest closeout revisions (listLatestCloseoutsBetween)."
      - "'What price changes added' = price effect of comparable purchase lines vs the previous period (priceVolume over recorded purchases) (pulse.ts:243-264)"
      - "'Dishes and menus over target' = count of dishes/menus over target at TODAY's catalog prices (pulse.ts:265-275)"
      - "Callouts (callouts.ts): top 3 price rises traced to over-target dishes; an event over target with 'Charging $X a guest instead of $Y brings it to target.'; closeouts over plan ('<event> cost N% more than planned.'); staged invoices/price sheets waiting in Import; unpriced events; missing selling prices/costing; purchase lines with no pack size."
      - "Event ledger 'Events this week' + 'Next week' and a lazily loaded trend chart (src/routes/analytics/+page.svelte:35-56)."
    plan_gate: "none (Launch plan; any active member incl. STAFF)"
    limits:
      - "Food only: staffing, rentals, packaging and overproduction are not modelled anywhere (pulse.ts:197; CONTEXT.md 'Event Food-Cost Percent')."
      - "Events without a price, or without a frozen confirmed plan, are left out of the percentages and the page says so (pulse.ts:170-173)."
      - "Sales are booked event value, not money collected; there is no deposit/balance/receivables figure anywhere in Analytics (grep of analytics modules for deposit|balance|stripe: none)."
      - "Square counter sales are NOT in the Overview; they live only on the Counter sales tab."
      - "Empty workspace shows 'Nothing to report yet' with 'Add an invoice' (src/routes/analytics/+page.svelte:19-24)."
    glossary_terms: [Event Food-Cost Percent, Per-Guest Price, Target Food Cost, Closeout]
    capture_worthy: "yes: the attention panel with a traced price rise ('1 dish or menu using it is over target.') above the six figures"

