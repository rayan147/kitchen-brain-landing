# Lane F: Buying and supplier invoices
# Source: ~/kitchen-brain-develop-demo (develop = origin/main = ed6ff5f01, HEAD confirmed 2026-09-27).
# "Invoice" unqualified = SUPPLIER invoice throughout.
# Paths in evidence are relative to the kitchen-brain repo root. Labels quoted from source.
# Plan gate: docs/billing.md describes one paid plan (Launch, $49/month); no buying
# feature checks a plan tier. Gates listed below are role gates or release flags.

rows:
  - id: F-01
    lane: F
    workflow: "Log what was just bought"
    job_to_be_done: "Get a shop run or a single receipt into the books so pack costs, recipe costs and month spend move with it"
    actors: [owner, manager, staff]
    routes: ["/purchases"]
    entry: "Purchases > 'Log purchase' (header, wide screens) or the phone action bar; 'More' > 'Log one item'; ingredient page > 'Log a purchase'"
    done_marker: "'Purchase logged' alert: names which recipes change cost, or 'No recipe costs change: nothing in the catalog uses these ingredients yet.' When an upcoming event is affected: 'Purchase saved. It changes what an upcoming event costs.' with 'Review affected events'"
    hands_off_to: F-08
    tier: production
    evidence:
      - "e2e/manual-entry.spec.ts ('manual-entry composer prices lines, gates Add, and commits the run')"
      - "src/routes/purchases/+page.svelte:134 ('Log purchase'), :138 ('Import invoice'), :202-205"
      - "src/lib/components/purchases/ManualEntryDialog.svelte:225, :343 ('Purchase logged'), :365 ('Log $X purchase'), :367 ('Each line shows the new pack cost before you save.')"
      - "src/lib/components/purchases/PurchaseEntryMenu.svelte:98 ('Log one item', hint 'One line, with a note')"
      - "src/routes/ingredients/[id]/IngredientOverviewRedesign.svelte:218 ('Log a purchase')"
    plan_gate: "none (any signed-in role; /purchases action guard requireRole at src/routes/purchases/+page.server.ts:222)"
    limits:
      - "Needs at least one ingredient first; an empty kitchen sees 'Start with an invoice' instead of the log button"
      - "Current Cost follows purchase DATE, not entry order: back-logging an older receipt records history but never overwrites a newer price (CONTEXT.md 'Current Cost')"
      - "Supplier is a field on the purchase; it does not create a purchase order"
    glossary_terms: [Purchase, Current Cost, Actual Spend]
    capture_worthy: "yes: the Log purchase dialog showing each line's new pack cost before save"

  - id: F-02
    lane: F
    workflow: "Import a supplier invoice and update costs"
    job_to_be_done: "Turn a paper or PDF invoice into purchases and current pack costs without typing every line"
    actors: [owner, manager, staff]
    routes: ["/import", "/import/source/[id]", "/import/result"]
    entry: "Purchases > 'Import invoice'; Supplier invoices > 'Add supplier invoice' (/import?kind=invoice); Import page type toggle 'Invoice'; drop zone 'Drop invoices & price lists'; phone camera 'Add document to queue'"
    done_marker: "/import/result heading 'Invoice imported', card 'What changed', buttons 'View purchases' / 'Review affected events'. Before commit the review says 'Ready to import' ('Extraction, required decisions, and consequence checks are complete.')"
    hands_off_to: F-08
    tier: production
    evidence:
      - "e2e/canonical-import.spec.ts ('mobile invoice review keeps catalog decisions visible...', 'an OCR-only PDF preserves the source and offers isolated retry', 'setup invoice review stays focused and lands on a durable setup result')"
      - "e2e/photo-import.spec.ts ('invoice photo is preserved for OCR recovery when provider is unavailable')"
      - "src/routes/import/+page.svelte:12 ('Import and review'), :21 (lead copy: 'CostCook reads it, and you check anything it wasn't sure of before it goes into your records.')"
      - "src/lib/components/import/SourceTypeSelector.svelte:56 ('Invoice')"
      - "src/lib/components/import/CanonicalSourceReview.svelte:1161 ('Import invoice and update costs'), :924 ('Create supplier on import'), :1347-1353 ('Ready to import')"
      - "src/lib/components/import/InvoiceLineReviewAccordion.svelte:275 ('Exclude this line'), :370 ('Catalog decision'), :720 ('Create new ingredient'), :774 ('Edit purchase unit and invoice values')"
      - "src/lib/server/import/invoice-commit.ts:412-437, :567, :581, :670-675 (blockers)"
      - "src/routes/import/result/+page.svelte:14 ('Invoice imported')"
    plan_gate: "none"
    limits:
      - "Nothing is written until a person presses 'Import invoice and update costs'; extraction alone never creates records"
      - "One invoice per review; a batch of files keeps each invoice's review separate"
      - "PDFs with a text layer are read by CostCook's own rule-based parser. Scans and phone photos need an AI reader (OCR through the configured provider: Google Gemini 'gemini-3.5-flash-lite' by default, or Claude Sonnet 5 when IMPORT_AI_PROVIDER=anthropic; src/lib/server/import/provider.ts:93-103, ocr-adapter.ts:30)"
      - "Where no AI reader is configured, a scan stops at 'Scan not readable' / 'This PDF needs OCR' ('This is a scan, and no scan reader is set up here...'); the file is kept and can be replaced with a text PDF"
      - "Lines the reader is unsure of are NOT guessed into the books: low-confidence quantity or money becomes a blocker ('Confirm the low-confidence quantity for ...', 'Confirm the low-confidence financial values for ...'); every line needs a catalog decision, a new ingredient, or 'Exclude this line'"
      - "Import is blocked when printed and calculated totals differ ('The lines do not add up to the invoice total.'), when no supplier is chosen, or when it looks like an invoice already imported ('Blocked: this looks like an invoice you already imported.')"
      - "Upload limit 3.5 MB per prepared file, 4.4 MB per request (src/lib/server/import/upload-validation.ts:15, :71)"
      - "The reading is never described as complete or accurate by the app; the owner confirms"
    glossary_terms: [Staged Import, Purchase Evidence Suggestion, Current Cost, Reviewed Supplier Invoice]
    capture_worthy: "yes: phone invoice review with a line card showing 'Needs review' beside the catalog decision, then 'Invoice imported'"

