terms:
  - term: "Invoice (unqualified)"
    app_meaning: "The SUPPLIER invoice: an imported document whose lines become purchases and update pack costs (/purchases/invoices 'Supplier invoices'). Once reviewed it is a 'Reviewed Supplier Invoice'; for QuickBooks it becomes an 'Approved Payable' then a bill."
    not_to_confuse_with: "customer invoice / receivable (client money), CostCook's own Stripe subscription invoices (docs/billing.md)"
  - term: "Credit memo"
    app_meaning: "A supplier document that, once confirmed, takes its total off cost for its month; adds no purchases and changes no prices (CanonicalSourceReview.svelte:415-421)"
    not_to_confuse_with: "Supplier credit recorded for QuickBooks (SupplierCreditsSection), refunds to clients"
  - term: "Price sheet"
    app_meaning: "A supplier's asking prices; updates catalog pack cost directly, never enters the purchase log"
    not_to_confuse_with: "an invoice or a purchase"
  - term: "Purchase"
    app_meaning: "A ledger row of something bought (manual, invoice line, or received PO line); drives Current Cost and Actual Spend"
    not_to_confuse_with: "Purchase order (outbound request to a supplier)"
  - term: "Purchase order"
    app_meaning: "Per-supplier order generated from the shopping list, emailed or printed; the sent PO doubles as the receiving checklist; no PO numbers or statuses"
    not_to_confuse_with: "client order / catering order; Purchase Recommendation"
  - term: "Supplier vs Vendor"
    app_meaning: "Same thing. Settings page says 'Vendors & suppliers' and 'Add vendor'; purchases, invoices and import say 'supplier'. QuickBooks section says 'Vendor'."
    not_to_confuse_with: "landing should pick 'supplier' (the dominant app word)"
  - term: "Price impact"
    app_meaning: "A review item created when a new cost changes what an upcoming (draft or confirmed) event costs; closed by 'I changed a price or menu' or 'Checked, no change needed'"
    not_to_confuse_with: "Prices that moved (a plain list of changed pack prices)"
  - term: "Should have cost / Did cost"
    app_meaning: "UI labels for Usage Cost to Date and Actual Spend (CONTEXT.md)"
    not_to_confuse_with: "theoretical vs actual food cost % (landing may say 'food cost' loosely)"
  - term: "Invoice email / Invoice inbox"
    app_meaning: "A per-kitchen address suppliers send invoices to; everything waits in review"
    not_to_confuse_with: "a live production feature (mail worker is off in production as of ed6ff5f01)"
  - term: "Reading / OCR"
    app_meaning: "Text PDFs are parsed by rules; scans and photos are read by an AI provider (Gemini flash-lite default, Claude Sonnet 5 optional). The app says 'CostCook reads it, and you check anything it wasn't sure of'."
    not_to_confuse_with: "'Sage' (the assistant brand; import extraction is not labelled Sage unless Sage is on)"
