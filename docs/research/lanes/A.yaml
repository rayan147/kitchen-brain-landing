terms:
  - term: "Invoice (unqualified)"
    app_meaning: "The supplier invoice (/purchases/invoices). No customer invoice exists (A-19)."
    not_to_confuse: "customer invoice / receivable"
  - term: "Acceptance (#501)"
    app_meaning: "The client's recorded 'Accept this selection' on one offer revision. The page says 'Acceptance is not an e-signature or a booking confirmation.'"
    not_to_confuse: "Approval (#512, kitchen approving a storefront request); signature; booking"
  - term: "Approval (#512)"
    app_meaning: "Lane C: the kitchen approving an online order request, which opens a Payment Window. Not used anywhere on the event path."
    not_to_confuse: "Acceptance; booked"
  - term: "Booked"
    app_meaning: "The event's linked order is confirmed via 'Confirm order' (tentative-order.ts:181-183). It checks day capacity, not a signature or deposit (shell-actions.ts:129-160). Caveat: the workspace chip/stepper also say 'Booked' once an agreement completes ([id]/+page.server.ts:145)."
    not_to_confuse: "paid; signed; accepted"
  - term: "Deposit / balance"
    app_meaning: "A deposit obligation on the event-linked order (siteId null, modes offline|external), asked from the event screen, recorded on /orders/[id]. Balance: none for events on production. Owner words 'Catering deposit' / 'Catering balance' (ordering-payments/payment-terms.ts:225-227)."
    not_to_confuse: "subscription billing; storefront deposit via Payment Window"
  - term: "Payment processor for client money"
    app_meaning: "Storefront (lane C) card payments: Stripe Connect direct charges on the caterer's connected account, caterer is merchant of record (docs/architecture/ordering-payments.md:52-62). Event deposits on production: no processor in CostCook, check/cash/transfer or 'My own card processor' recorded by hand (event-deposit.ts:16-26). Square is catalog and sales import only (src/lib/server/integrations/square), never client money. A siteless Stripe Checkout for events exists only as uncommitted API in kb-client-payment (off-page)."
    not_to_confuse: "CostCook's own subscription (Stripe platform account, docs/billing.md)"
  - term: "Sales tax on a proposal"
    app_meaning: "Stripe Tax on the caterer's connected account when the kitchen's tax source is Stripe (src/lib/server/proposals/tax.ts; fails closed, never $0); otherwise a rate the owner types."
    not_to_confuse: "a tax rate CostCook knows"
  - term: "Kitchen draft"
    app_meaning: "The tentative order prepared from an accepted proposal; 'holds no day and draws no crew until you book the event'."
    not_to_confuse: "a storefront draft order; a proposal draft"
  - term: "Agreement vs contract"
    app_meaning: "UI says Agreement (step 5, /agreement); the older screens and code say contract (/contract, 'Prepare contract', Settings > Contracts for templates)."
    not_to_confuse: "proposal acceptance"
  - term: "Client vs customer"
    app_meaning: "Screens mostly say Client; offer/agreement screens and code also say customer ('Customer preview', 'Send offer', 'customer link')."
    not_to_confuse: "n/a (same person)"
  - term: "Proposal vs offer vs quote"
    app_meaning: "Proposal is the document; an offer is one sent revision with a link; 'quote' is the storefront's pricing arm in payment terms."
    not_to_confuse: "landing's 'menus and quotes'"
