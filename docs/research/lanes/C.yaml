# Lane C: online ordering and requests (2026-09-27)
# Production code: ~/kitchen-brain-develop-demo, HEAD ed6ff5f01 == origin/main (checked).
# Paths are relative to that checkout unless prefixed with a worktree name.
# The public storefront is a SEPARATE SvelteKit app: apps/ordering (hosted at ORDERING_APP_ORIGIN/<siteId>,
# default https://order.costcook.io per src/lib/server/ordering-payments/config.ts:49). It is not in src/routes.
#
# GATE THAT APPLIES TO MOST ROWS (read before tiering anything onto the page):
#   release flag `ordering_integration`: src/lib/server/features/access.ts:8-19,96-98 (true only for 'true'/'1'),
#   enforced for /settings/ordering* in src/hooks.server.ts:516-521 and src/routes/settings/ordering/+layout.server.ts:13-15
#   ("Ordering integrations are in development." 404). infra/env/production.env.example:50 leaves it blank (= off).
#   docs/billing.md:50-52: "not subscription entitlements and default off"; a business_feature_overrides row wins.
#   Rows marked plan_gate "ordering flag" are on origin/main but unreachable for a kitchen without that flag.

