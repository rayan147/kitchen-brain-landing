terms:
  - term: "Payment processor for client money"
    app_meaning: "Stripe Connect only (Accounts v2 connected account, STRIPE_ORDERING_* keys, stripe-gateway.ts), for storefront orders in payment mode 'kitchen_brain' (label 'CostCook'). 'External' = a partner reports payment; 'Offline' = the kitchen records it. Square is never used for client money. Event deposits on develop are offline/external only"
    not_to_confuse_with: "CostCook's own subscription (Stripe platform account, /api/auth/stripe/webhook, docs/billing.md)"
  - term: "Approval (#512)"
    app_meaning: "The chef's yes to a fixed-menu storefront request; fixes terms, opens the Payment Window; the order is still a draft"
    not_to_confuse_with: "Acceptance (client accepting a proposal, #501); Confirmed"
  - term: "Payment Window"
    app_meaning: "72 hours the approval holds the day awaiting payment; not owner-configurable today"
    not_to_confuse_with: "Stripe checkout session expiry"
  - term: "Estimate (client) vs quote (owner)"
    app_meaning: "The same server-priced number: the storefront says 'Current estimate' / 'Estimated total'; the owner sees 'Deposit (25%): $650.00 of the $2,600.00 quote.'"
    not_to_confuse_with: "Proposal (lane A); Price Quote is the server's time-limited price"
  - term: "Ordering site / Online ordering / Ordering integration / storefront"
    app_meaning: "Four names for one area: page titles 'Ordering site' and 'Ordering integration', settings hub row 'Online ordering' (settings/+page.server.ts:110), code and copy 'storefront'"
    not_to_confuse_with: "The landing should pick one caterer word"
  - term: "Partner"
    app_meaning: "On screen it means an outside payment/ordering system ('A trusted partner reports payment.', 'Partner reported', 'Your payment partner collects this one.')"
    not_to_confuse_with: "docs/ordering-integration.md:6-7 says CONTEXT.md binds 'partner' to the caterer; say 'ordering integration'"
  - term: "Custom Request"
    app_meaning: "A request the rules send to the chef for a price; takes no money; storefront ones now become Inquiries"
    not_to_confuse_with: "Quote; Inquiry (lane A)"
  - term: "Deposit / balance"
    app_meaning: "Payment obligations on the ORDER ('Catering deposit', 'Catering balance'), created at Approval from the booking rule"
    not_to_confuse_with: "Subscription billing; a customer invoice (#504, not built)"
