terms:
  - term: "Kitchen / workspace / business"
    app_meaning: "UI says 'kitchen' to owners ('Start your kitchen', 'Choose a kitchen') and 'workspace' in role refusals and integration cards ('Only a workspace owner can manage billing.', 'Not available for this workspace yet.'). CONTEXT.md's term is Business; 'organization' is the storage word only."
    not_confused_with: "a location or operating unit (off-page branches 485-490); one subscription covers one kitchen"
  - term: "Subscription / billing / plan"
    app_meaning: "CostCook's own charge to the caterer: Stripe via the Better Auth Stripe plugin, one plan 'CostCook Launch'"
    not_confused_with: "client money (deposits and balances on orders, Stripe Connect on the ordering site, lanes A/C). Square is POS sales evidence only, never a client-payment path"
  - term: "Set up your kitchen"
    app_meaning: "UI name for CONTEXT.md's First-Run Setup: five stages ending at a costed order and its shopping list"
    not_confused_with: "Concierge Onboarding (same workflow, support-assisted) and Sample data"
  - term: "Sample data"
    app_meaning: "Example suppliers, recipes, menus and orders loaded beside a real kitchen's records, removable after review"
    not_confused_with: "CONTEXT.md Demo Instance (a separate hosted instance with a shared login)"
  - term: "In development (integration badge)"
    app_meaning: "Badge on an integration card when the release flag is off for this kitchen ('In development', src/routes/settings/integrations/+page.svelte:43,69,111,147,176)"
    not_confused_with: "Square/QuickBooks 'Available': even with the flag on they are Sandbox test mode"
  - term: "Owner / Manager / Staff"
    app_meaning: "The only three roles; invites always start as Staff; billing and money-moving integrations are owner only"
    not_confused_with: "a permission grid or per-location roles (not built)"
  - term: "Notifications"
    app_meaning: "Emails, either 'Right away' or 'In the daily summary', per person and per role"
    not_confused_with: "the Today screen's attention list (home-only kinds are never mailed)"
  - term: "Webhook"
    app_meaning: "Outgoing HTTP POST to an address the kitchen adds, signed, under Ordering integration"
    not_confused_with: "the Stripe, Square and QuickBooks inbound webhooks CostCook receives"
